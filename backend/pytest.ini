[pytest]
# 测试收集与运行配置。
#
# 与既有 unittest 风格测试共存：pytest 兼容 unittest.TestCase，无需改写旧测试即可
# 用 pytest 运行。新测试推荐用 pytest 原生风格（fixture / 参数化）。

# 收集范围：仅 backend/tests/。
testpaths = tests

# 已注册的 marker（--strict-markers 下，未注册的 marker 会报错，防止拼写错误静默通过）。
markers =
    known_issue: 测试断言【正确】行为但当前实现有 bug（失败=可见的待修 backlog）。用 `pytest -m known_issue` 单独运行。

# 默认选项：
#   -ra   摘要显示所有失败/错误/跳过原因
#   --strict-markers   未注册 marker 即报错
#   --strict-config    pytest.ini / pyproject 配置错误即报错
#   -p no:cacheprovider 关闭 .pytest_cache 写入（保持工作区干净；CI 也无需缓存）
addopts = -ra --strict-markers --strict-config -p no:cacheprovider

# 静默 Python 警告噪声（仅对测试期）；真实问题会显式断言。
filterwarnings =
    ignore::DeprecationWarning
