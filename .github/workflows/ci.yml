# CI 守门（项目情况完全分析.md C7/E：此前仓库无任何 CI）。
#
# 红灯即禁止合并（§6.1）：
#   - backend：ruff + pytest 安全网（`-m "not known_issue"` 必须绿 = 可部署）；
#     另有 known_issue backlog 步骤（informational，允许失败 = 暴露待修 bug 数）。
#   - frontend：eslint + tsc 类型检查 + vitest
#
# Python 版本与生产对齐（3.11）；Node 用 LTS。依赖走 lock 文件保证可复现。

name: CI

on:
  push:
    branches: [main, lite]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: python -m ruff check app tests scripts

      - name: Pytest (safety net — must stay green)
        run: python -m pytest -m "not known_issue" -q
        env:
          AINOVEL_APP_ENV: test

      - name: Known-issue backlog (informational, expected to fail)
        run: python -m pytest -m known_issue -q
        continue-on-error: true
        env:
          AINOVEL_APP_ENV: test

  frontend:
    name: Frontend (vitest + tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint 当前含若干历史遗留问题（与测试无关），暂设为非阻塞：报告但不致 CI 红灯。
      # 待前端 lint 清理后改为硬门禁（对齐 §6.1）。
      - name: ESLint + Prettier + UI class check
        run: npm run lint
        continue-on-error: true

      - name: Type check (app build)
        run: npx tsc -b

      - name: Type check (tests)
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Vitest (safety net — must stay green)
        run: npx vitest run --tagsFilter '!@known_issue'

      - name: Known-issue backlog (informational, expected to fail)
        run: npx vitest run --tagsFilter '@known_issue'
        continue-on-error: true
