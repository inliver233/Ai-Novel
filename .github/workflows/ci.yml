# CI 守门（项目情况完全分析.md C7/E：此前仓库无任何 CI）。
#
# 红灯即禁止合并（§6.1）：
#   - backend：ruff + pytest/coverage 安全网（`-m "not known_issue"` 必须绿 = 可部署）；
#     另有 known_issue backlog 步骤（informational，允许失败 = 暴露待修 bug 数）。
#   - frontend：tests-only lint/format + 生产构建 + 测试类型检查 + vitest/coverage；
#     全量 lint 暂为 informational（既有业务源码债清理后再升为硬门禁）。
#
# Python 版本与生产对齐（3.11）；Node 用 LTS。依赖走 lock 文件保证可复现。

name: CI

on:
  push:
    branches: [dev, main, lite]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-rate-limit-redis:
    name: Auth rate limit (real Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      AINOVEL_APP_ENV: test
      AINOVEL_REDIS_INTEGRATION: "1"
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Redis multi-client atomicity integration (hard gate)
        run: python -m pytest tests/test_auth_rate_limit_redis_integration.py -q

  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: python -m ruff check app tests scripts conftest.py

      - name: SQLite schema contract (hard gate)
        shell: bash
        run: |
          contract_db="$(mktemp "${RUNNER_TEMP}/ainovel-alembic-contract.XXXXXX.db")"
          trap 'rm -f "$contract_db" "$contract_db-shm" "$contract_db-wal"' EXIT
          python scripts/check_alembic.py --database-url "sqlite:///$contract_db"

      - name: Pytest + coverage baseline (safety net — must stay green)
        run: python -m pytest -m "not known_issue" -q --cov=app --cov-report=term --cov-fail-under=62
        env:
          AINOVEL_APP_ENV: test

      - name: Known-issue backlog (informational, expected to fail)
        run: python -m pytest -m known_issue -q
        continue-on-error: true
        env:
          AINOVEL_APP_ENV: test

  postgres-schema:
    name: PostgreSQL + pgvector schema contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ainovel
          POSTGRES_PASSWORD: ainovel
          POSTGRES_DB: ainovel_schema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ainovel -d ainovel_schema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://ainovel:ainovel@localhost:5432/ainovel_schema_ci
      TEST_POSTGRES_URL: postgresql+psycopg2://ainovel:ainovel@localhost:5432/ainovel_schema_ci
      AINOVEL_POSTGRES_INTEGRATION: "1"
      AINOVEL_POSTGRES_INTEGRATION_SENTINEL: "I_UNDERSTAND_THIS_DROPS_PUBLIC_SCHEMA"
      AINOVEL_APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: PostgreSQL cleanup + reconciliation integration (hard gate)
        run: python -m pytest tests/test_alembic_postgres_integration.py -q --junitxml="$RUNNER_TEMP/postgres-schema.xml"

      - name: Report PostgreSQL integration failure
        if: failure()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / "postgres-schema.xml"
          if report.exists():
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for node in list(case):
                      if node.tag not in {"failure", "error"}:
                          continue
                      summary = node.get("message") or "PostgreSQL integration failed"
                      details = node.text or ""
                      message = (summary + "\n" + details).replace("\n", "%0A")
                      print(f"::error title={case.get('name', 'PostgreSQL integration')}::{message}")
          PY

      - name: Reset integration schema
        run: python -c "import os, sqlalchemy as sa; e=sa.create_engine(os.environ['DATABASE_URL']); c=e.connect().execution_options(isolation_level='AUTOCOMMIT'); c.exec_driver_sql('DROP SCHEMA IF EXISTS public CASCADE'); c.exec_driver_sql('CREATE SCHEMA public'); c.close(); e.dispose()"

      - name: PostgreSQL schema contract (hard gate)
        run: python scripts/check_alembic.py --database-url "$DATABASE_URL"

  frontend:
    name: Frontend (vitest + tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint 当前含若干历史遗留问题（与测试无关），暂设为非阻塞：报告但不致 CI 红灯。
      # 待前端 lint 清理后改为硬门禁（对齐 §6.1）。
      - name: ESLint + Prettier + UI class check
        run: npm run lint
        continue-on-error: true

      - name: Test lint + formatting (hard gate)
        run: |
          npx eslint tests vitest.config.ts
          npx prettier --check tests vitest.config.ts tsconfig.test.json

      - name: Production build
        run: npm run build

      - name: Type check (tests)
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Vitest + coverage baseline (safety net — must stay green)
        run: npx vitest run --coverage --tagsFilter '!@known_issue'

      - name: Known-issue backlog (informational, expected to fail)
        run: npx vitest run --tagsFilter '@known_issue'
        continue-on-error: true
